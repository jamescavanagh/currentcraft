[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datamesh-agency-toolkit"
version = "0.9.9"
description = "Currentcraft: an open-source agency platform for complex systems-integration projects, making situation, alternatives, readiness and decision rights legible so people can act on evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pydantic>=2.7,<3"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
pdf = ["pypdf>=4,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
nats = ["nats-py[nkeys]>=2.9,<3"]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.18,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app", "app.domain*", "app.application", "app.application.gauge*", "app.application.simulation*", "app.application.process*", "app.application.plate*", "app.application.messaging*", "app.application.enrichment*", "app.application.probe*", "app.application.ingest*", "app.application.persistence*", "app.infrastructure", "app.infrastructure.gauge*", "app.infrastructure.tensors*", "app.infrastructure.plate*", "app.infrastructure.messaging*", "app.infrastructure.enrichment*", "app.infrastructure.probe*", "app.infrastructure.ingest*", "app.infrastructure.persistence*", "app.application.splice*", "app.infrastructure.splice*", "app.application.enterprise*", "app.infrastructure.enterprise*", "app.application.common*","app.application.p4*","app.application.hfgt*","app.infrastructure.hfgt*","app.interfaces*", "app.application.queries*"]
namespaces = false

[tool.setuptools]
include-package-data = false
